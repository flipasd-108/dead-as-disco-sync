# Every push to main runs the self-test. A pushed tag v* also becomes a release: build the GPU variant and
# attach the three files users need. Release notes come from the annotated tag:
#   git tag -a v1.8 -F notes.md && git push origin v1.8
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: disco_sync.py

      - name: Self-test
        run: uv run disco_sync.py --test

      - name: Build the release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python tools/make_gpu.py disco_sync.py
          cp run.bat DeadAsDiscoSync.bat

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" DeadAsDiscoSync.bat disco_sync.py disco_sync_gpu.py
          --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
